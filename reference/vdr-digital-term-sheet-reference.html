<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VDR Digital Term Sheet — Single-Tranche Vanilla Eurobond</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#E9EDF1; --surface:#FFFFFF; --surface-2:#F4F7F9; --ink:#16202B; --muted:#5D6E7E;
  --rule:#CBD4DC; --rule-strong:#A9B6C1; --brass:#8A6A1F; --brass-soft:#F0E6CC;
  --pass:#1F6F4A; --warn:#9A4A12; --fail:#8E2A2A; --focus:#1B5E8A;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#111820; --surface:#18212B; --surface-2:#1E2933; --ink:#E6ECF1; --muted:#9BABB8;
    --rule:#2C3A47; --rule-strong:#3D4E5D; --brass:#D6B25F; --brass-soft:#3A2F14;
    --pass:#5FC08D; --warn:#E39A5C; --fail:#E38080; --focus:#7BC1EA;
  }
}
:root[data-theme="dark"]{
  --ground:#111820; --surface:#18212B; --surface-2:#1E2933; --ink:#E6ECF1; --muted:#9BABB8;
  --rule:#2C3A47; --rule-strong:#3D4E5D; --brass:#D6B25F; --brass-soft:#3A2F14;
  --pass:#5FC08D; --warn:#E39A5C; --fail:#E38080; --focus:#7BC1EA;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-0.01em}
a{color:var(--focus)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- masthead ---------- */
.masthead{background:var(--surface);border-bottom:1px solid var(--rule);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.mast-in{max-width:1400px;margin:0 auto;padding:14px 20px 0;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.deal{flex:1 1 320px;min-width:260px}
.deal input{font-family:var(--sans);font-size:19px;font-weight:600;color:var(--ink);background:transparent;border:0;border-bottom:1px dashed var(--rule);width:100%;padding:2px 0}
.deal input:focus{border-bottom-color:var(--focus)}
.deal .sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:5px}
.mast-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:11.5px;padding:4px 9px;border:1px solid var(--rule-strong);border-radius:2px;color:var(--muted);background:var(--surface-2)}
.pill.live{border-color:var(--brass);color:var(--brass);background:var(--brass-soft)}
button{font-family:var(--sans);font-size:13.5px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:2px;cursor:pointer}
button:hover{border-color:var(--ink)}
button.primary{background:var(--brass);border-color:var(--brass);color:#fff;font-weight:500}
:root[data-theme="dark"] button.primary,:root:not([data-theme="light"]) button.primary{color:#171208}
button.primary:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:transparent}

/* ---------- stage rail (the hero) ---------- */
.rail{max-width:1400px;margin:0 auto;padding:14px 20px 0;overflow-x:auto}
.rail ol{display:flex;list-style:none;margin:0;padding:0 0 2px;min-width:720px;gap:0}
.rail li{flex:1;position:relative}
.rail button.stage{width:100%;text-align:left;border:0;background:transparent;padding:6px 10px 12px 0;display:block;border-bottom:3px solid var(--rule)}
.rail button.stage .n{font-family:var(--mono);font-size:11px;color:var(--muted);display:block}
.rail button.stage .t{font-size:13px;color:var(--muted);white-space:nowrap}
.rail li.done button.stage{border-bottom-color:var(--rule-strong)}
.rail li.done .t{color:var(--ink)}
.rail li.now button.stage{border-bottom-color:var(--brass)}
.rail li.now .t{color:var(--ink);font-weight:600}
.rail li.now .n{color:var(--brass)}
.tabs{max-width:1400px;margin:0 auto;padding:10px 20px 0;display:flex;gap:2px;flex-wrap:wrap}
.tabs button{border:1px solid var(--rule);border-bottom:0;background:var(--surface-2);border-radius:2px 2px 0 0;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:inset 0 2px 0 var(--brass)}

/* ---------- layout ---------- */
.shell{max-width:1400px;margin:0 auto;padding:0 20px 56px}
.grid{display:grid;grid-template-columns:200px minmax(0,1fr) 288px;gap:20px;align-items:start;background:var(--surface);border:1px solid var(--rule);border-top:0;padding:18px}
@media(max-width:1100px){.grid{grid-template-columns:minmax(0,1fr)}.sidenav,.checkscol{position:static!important}}
.sidenav{position:sticky;top:130px}
.sidenav h3,.checkscol h3{font-size:11.5px;font-family:var(--mono);color:var(--muted);font-weight:500;margin-bottom:8px}
.sidenav a{display:flex;justify-content:space-between;gap:6px;padding:5px 0;font-size:13.5px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}
.sidenav a span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.sidenav a.gap span{color:var(--fail)}
.checkscol{position:sticky;top:130px;max-height:calc(100vh - 170px);overflow:auto}

/* ---------- term rows ---------- */
section.block{margin:0 0 26px}
section.block>h2{font-size:15px;padding-bottom:6px;border-bottom:1px solid var(--rule-strong);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
section.block>h2 em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
.note{font-size:13px;color:var(--muted);margin:8px 0 12px;max-width:66ch}
.row{display:grid;grid-template-columns:30px 230px minmax(0,1fr);gap:10px;align-items:start;padding:7px 0;border-bottom:1px solid var(--rule)}
@media(max-width:700px){.row{grid-template-columns:24px minmax(0,1fr)}.row .val{grid-column:2}}
.row .num{font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:7px}
.row label{font-size:13.5px;padding-top:6px}
.row label .xp{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted);word-break:break-all;margin-top:2px}
.row.req label{font-weight:500}
.row.req label::after{content:" *";color:var(--fail)}
.row.future{opacity:.5}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--surface-2);border:1px solid var(--rule);border-radius:2px;padding:6px 8px}
input[type=text].plain,textarea{font-family:var(--sans);font-size:13.5px}
select{font-family:var(--sans)}
textarea{min-height:62px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--focus);background:var(--surface)}
.inline{display:flex;gap:6px;flex-wrap:wrap}
.inline>*{flex:1 1 90px;min-width:80px}
.chk{display:flex;align-items:center;gap:7px;font-size:13.5px;padding-top:5px}
.chk input{width:16px;height:16px;accent-color:var(--brass)}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.bad input,.bad select{border-color:var(--fail)}
.fielderr{font-size:12px;color:var(--fail);margin-top:3px}

/* ---------- repeating groups ---------- */
.cards{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.card{border:1px solid var(--rule);border-left:3px solid var(--rule-strong);padding:11px;background:var(--surface-2)}
.card.isr{border-left-color:var(--brass)}
.card .head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}
.card .head b{font-size:13px}
.card .fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.card .fr label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px}
button.mini{font-size:12px;padding:3px 8px}

/* ---------- checks ---------- */
.check{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:12.5px;align-items:flex-start}
.check .dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;margin-top:5px}
.dot.pass{background:var(--pass)}.dot.warn{background:var(--warn)}.dot.fail{background:var(--fail)}
.check b{font-weight:500;display:block}
.check p{margin:2px 0 0;color:var(--muted)}
.meter{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin:6px 0 12px}
.meter i{display:block;height:100%;background:var(--brass)}
.tally{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:4px}

/* ---------- panes ---------- */
.pane{display:none}
.pane.on{display:block}
pre.out{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--rule);padding:12px;overflow:auto;max-height:66vh;white-space:pre;margin:0}
.ts{max-width:74ch}
.ts h2{font-size:17px;margin-bottom:2px}
.ts .issuer{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:14px}
.ts table{width:100%;border-collapse:collapse;font-size:13.5px}
.ts th{text-align:left;font-weight:500;vertical-align:top;padding:6px 12px 6px 0;width:34%;border-bottom:1px solid var(--rule);color:var(--muted)}
.ts td{padding:6px 0;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:12.5px;word-break:break-word}
.ts caption{caption-side:bottom;text-align:left;font-size:12px;color:var(--muted);padding-top:12px}
.legend{font-size:11.5px;color:var(--muted);border:1px solid var(--rule);border-left:3px solid var(--brass);padding:9px 11px;margin:14px 0}
.chan{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:14px 0}
.chan .c{border:1px solid var(--rule);padding:13px;background:var(--surface-2)}
.chan .c h3{font-size:13.5px;font-family:var(--sans);color:var(--ink);margin-bottom:5px}
.chan .c p{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.log{font-family:var(--mono);font-size:12px;border-collapse:collapse;width:100%}
.log th,.log td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);font-size:13px;padding:9px 15px;border-radius:2px;z-index:60;max-width:90vw}
.footbar{position:fixed;bottom:0;left:0;right:0;padding:8px 20px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--rule);display:flex;gap:12px;justify-content:space-between;align-items:center;font-size:12.5px;z-index:30}
@media print{
  .masthead,.footbar,.sidenav,.checkscol,.tabs,.rail,button{display:none!important}
  .grid{grid-template-columns:1fr;border:0;padding:0}
  body{background:#fff;color:#000;font-size:11pt}
  .ts td,.ts th{border-bottom:1px solid #999}
  .pane:not(.on){display:none}
}
.filter{width:100%;margin-bottom:10px}
.diff{font-family:var(--mono);font-size:12px}
.diff div{padding:4px 0;border-bottom:1px solid var(--rule)}
.diff s{color:var(--muted);text-decoration:line-through}
.diff b{color:var(--brass);font-weight:500}

.expander{margin-top:10px;font-size:12.5px;color:var(--muted);border-style:dashed}
.expander:hover{color:var(--ink)}
.dropzone{border:1.5px dashed var(--rule-strong);background:var(--surface-2);padding:20px;text-align:center;display:flex;flex-direction:column;gap:7px;align-items:center;border-radius:2px}
.dropzone.over{border-color:var(--brass);background:var(--brass-soft)}
.dropzone b{font-size:14px}
.dropzone span{font-size:12px;color:var(--muted)}
.filelist{margin-top:10px}
.filelist div{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;padding:5px 0;border-bottom:1px solid var(--rule)}
.sugs{border-top:1px solid var(--rule-strong)}
.sug{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
@media(max-width:760px){.sug{grid-template-columns:minmax(0,1fr)}}
.sug b{font-size:13px;font-weight:500;display:block}
.sug .src{font-family:var(--mono);font-size:10.5px;color:var(--muted);word-break:break-all}
.sug .vals{font-family:var(--mono);font-size:12px;word-break:break-word}
.sug .vals s{color:var(--muted)}
.sug .vals b{display:inline;color:var(--brass)}
button.mini.primary{background:var(--brass);border-color:var(--brass);color:#fff}
:root[data-theme="dark"] button.mini.primary{color:#171208}
.footbar .st{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="masthead">
  <div class="mast-in">
    <div class="deal">
      <input id="dealName" value="" aria-label="Deal name" placeholder="Issuer — currency, tenor, format">
      <div class="sub"><span id="dealRef"></span> · v<span id="verLbl">0.1</span> · BDT 2.0.0</div>
    </div>
    <div class="mast-actions">
      <span class="pill" id="stagePill">Stage 1 · Announcement</span>
      <span class="pill" id="valPill">—</span>
      <button class="ghost" id="btnExample">Load worked example</button>
      <button class="ghost" id="btnTheme" title="Switch light/dark">Theme</button>
      <button class="primary" id="btnRelease">Release to stakeholders</button>
    </div>
  </div>
  <div class="rail"><ol id="rail"></ol></div>
  <div class="tabs" id="tabs" role="tablist"></div>
</div>

<div class="shell">
  <div class="grid">
    <nav class="sidenav" id="sidenav" aria-label="Sections"><h3>Sections</h3><div id="navlist"></div></nav>
    <main>
      <div class="pane on" id="pane-fill"></div>
      <div class="pane" id="pane-sheet"></div>
      <div class="pane" id="pane-xml"></div>
      <div class="pane" id="pane-env"></div>
      <div class="pane" id="pane-legends"></div>
      <div class="pane" id="pane-dist"></div>
      <div class="pane" id="pane-log"></div>
    </main>
    <aside class="checkscol" id="checkscol"><h3>Readiness for this stage</h3><div id="checks"></div></aside>
  </div>
</div>

<div class="footbar">
  <span class="st" id="saveState">Draft held in this browser only</span>
  <span class="st">Legal documentation prevails over this digital record</span>
</div>
<script>
/* ============================================================
   VDR Digital Term Sheet — field dictionary
   Paths are BDT 2.0 element paths below <ICMABondDataTaxonomy>.
   Fields marked ext:1 are VDR execution fields with no BDT 2.0
   home; they travel in the VDR envelope, not the BDT payload.
   ============================================================ */
const STAGES = [
  {k:"ANNOUNCE", t:"Announcement"},
  {k:"IPT",      t:"Initial price thoughts"},
  {k:"GUIDANCE", t:"Guidance"},
  {k:"LAUNCH",   t:"Spread set / launch"},
  {k:"PRICED",   t:"Priced"},
  {k:"ALLOCATED",t:"Allocated"},
  {k:"FINAL",    t:"Final terms"}
];

const E = {
  DocumentStatus:["PENDING","ISSUED","WITHDRAWN"],
  PartyRoleType:["ISSUER","GUARANTOR","GLOBAL_COORDINATOR","LEAD_MANAGER","JOINT_LEAD_MANAGER","JOINT_BOOKRUNNER","CO_MANAGER","ARRANGER","UNDERWRITER","PLACEMENT_AGENT","STABILISATION_MANAGER","BILLING_AND_DELIVERY_AGENT","FISCAL_AGENT","PRINCIPAL_PAYING_AGENT","PAYING_AGENT","CALCULATION_AGENT","TRUSTEE","REGISTRAR","TRANSFER_AGENT","CUSTODIAN","CSD_ICSD","LISTING_AGENT","LODGING_AGENT","ISSUE_AGENT","SETTLEMENT_AGENT","DETERMINATION_AGENT","EXCHANGE_AGENT","INFORMATION_AGENT","LEGAL_ADVISOR","LEGAL_COUNSEL","AUDITOR","PLATFORM_OPERATOR"],
  PartyType:["CORPORATION","SUPRANATIONAL","SOVEREIGN","MUNICIPAL","PROVINCE","STATE","COUNTY","PARTNERSHIP","FINANCIALINSTITUTION","NATIONAL"],
  RatingAgency:["FITCH","MOODYS","SNPG","DBRS","SCOPE"],
  RatingOutlook:["POSITIVE","STABLE","NEGATIVE","DEVELOPING","NOT_MEANINGFULL","EVOLVING","NOT_APPLICABLE"],
  IssuanceType:["STANDALONE","PROGRAMME","PROGRAMME_NOTE","GLOBAL_NOTE","SERIES","TRANCHE","CLASS","TAP"],
  AmountType:["NOMINAL","MONEY","UNIT","PERCENT"],
  PriceType:["PERCENT","ABSOLUTE","SPREAD","BASIS_POINT"],
  FeeAllocationType:["EQUAL","PROPORTIONAL"],
  DeliveryType:["DVP","FREE_OF_PAYMENT"],
  TermPeriod:["DAY","WEEK","MONTH","QUARTER","SEMI_ANNUAL","YEAR"],
  BenchmarkCode:["ESTR","EURI","SOFR","SONA","TREA","SWAP","ECBR","CORA","TIBO","BBSW","CDOR","NIBO","STBO","CIBO","HKIO","JIBA","WIBO","OTHR"],
  UseOfProceedsPrimary:["CORPORATE_PURPOSES","SOVEREIGN_FINANCING","MERGERS_ACQUISITION_FINANCING","MERGERS_ACQUISITION_SEED_FINANCING","INVESTMENT","LBO_FINANCING","DEBT_REFINANCING","REGULATORY","GENERAL_ASSET_FINANCING","SUSTAINABLE_FINANCING"],
  UseOfProceedsSub:["GENERAL_PURPOSES","STRAIGHT_BOND","TIER1_CAPITAL","TIER2_CAPITAL","TIER3_CAPITAL","BAIL_IN","COVERED_BOND","ICMA_GREEN_BOND_PRINCIPLES","ICMA_SOCIAL_BOND_PRINCIPLES","ICMA_SUSTAINABILITY_BOND_GUIDELINES","ICMA_SUSTAINABILITY_LINKED_BOND_PRINCIPLES","OTHER"],
  ListingMarket:["LONDON_STOCK_EXCHANGE","LUXEMBOURG_STOCK_EXCHANGE","EURONEXT_DUBLIN","EURONEXT_AMSTERDAM","EURONEXT_PARIS","EURONEXT_BRUSSELS","FRANKFURT_STOCK_EXCHANGE","BORSA_ITALIANA","SIX_SWISS_EXCHANGE","VIENNA_STOCK_EXCHANGE","SINGAPORE_SGX","HONGKONG_STOCK_EXCHANGE","NASDAQ_DUBAI","INTERNATIONAL_STOCK_EXCHANGE","NOT_LISTED"],
  ListingMarketType:["RMKT","RMQI","MSGM","MLTF"],
  ClearingSystem:["EUROCLEAR_BANK_SA/NV","CLEARSTREAM_BANKING_S.A.","CLEARSTREAM_BANKING_FRANKFURT","CLEARSTREAM_EUROPE_AG(CEU)","THE_DEPOSITORY_TRUST_COMPANY","CENTRAL_MONEYMARKETS_UNIT","EURONEXT_SECURITIES_MILANO","T2"],
  PlaceOfDeposit:["EUROCLEAR_BANK_SA/NV","CLEARSTREAM_BANKING_S.A.","CLEARSTREAM_BANKING_FRANKFURT","THE_DEPOSITORY_TRUST_COMPANY","CENTRAL_MONEYMARKETS_UNIT"],
  DistributionMethod:["SYNDICATED","NON-SYNDICATED"],
  TaxCode:["GROSS_UP","EXEMPT","WITHHOLDING","WITHHOLDING_PROCESSED_BY_ICSD","ITALIAN_239T","ITALIAN_239A","US_SOURCE_US_WITHHOLDING","US_TAX_SECTION_871M","US_TAX_OTHER_INCOME"],
  TefraCode:["TEFRA_C","TEFRA_D","TEFRA_NA","TEFRA_NoCode"],
  RegSCode:["REGS_CAT1","REGS_CAT2","REGS_CAT3","REGS_NA","REGS_NoCode"],
  PRIIPs:["NO_EEA","NO_UK","EEA","UK","NOT_APPLICABLE"],
  CCI:["APPLICABLE","NOT_APPLICABLE"],
  TargetMarket:["EU_MIFIDII_PROF_AND_ECPS","UK_MIFIDII_PROF_AND_ECPS","EU_MIFIR_PROF_AND_ECPS","UK_MIFIR_PROF_AND_ECPS","EU_MIFIDII_RETAIL_PROF_ECPS","UK_MIFIDII_RETAIL_PROF_ECPS","NOT_APPLICABLE"],
  Applicability:["APPLICABLE","NOT_APPLICABLE"],
  RedemptionType:["MATURITY","ISSUER_CALL","INVESTOR_PUT","SINKING_FUND","CHANGE_OF_CONTROL_PUT_EVENT","REGULATORY_REASONS","EXTRAORDINARY","CONVERTIBLE"],
  PhysicalForm:["GLOBAL_NOTE_CERTIFICATE","CERTIFICATED","DEMATERIALISED","UNCERTIFICATED"],
  LegalTitleForm:["BEARER","REGISTERED","DEMATERIALISED","BOOK_ENTRY","COLLECTIVE_DEBT_REGISTERED_CLAIM"],
  GlobalNoteType:["PERMANENT","TEMPORARY","REGISTERED"],
  SafeKeeping:["NEW_GLOBAL_NOTE","CLASSIC_GLOBAL_NOTE","NEW_SAFEKEEPING_STRUCTURE_PHYSICAL","NEW_SAFEKEEPING_STRUCTURE_ELECTRONIC","RESTRICTED","UNRESTRICTED"],
  GuaranteeType:["NO_GUARANTEE","GOVERNMENT","STATE","JOINT"],
  Seniority:["SENIOR","SUPER_SENIOR","MEZZANINE","JUNIOR"],
  Subordinated:["UNSUBORDINATED","SUBORDINATED"],
  Secured:["UNSECURED","SECURED"],
  Preferred:["PREFERRED","NON_PREFERRED"],
  AdditionalStatus:["TIER1CAPITAL","TIER2CAPITAL","TIER3CAPITAL","BAIL-IN","COVERED","STRUCTURED_COVERED"],
  MaturityType:["FIXED","PERPETUAL","EXTENDIBLE"],

function inputFor(fd) {
  const wrap = el("div", "val");
  const id = "i_" + fd.p.replace(/[^\w]/g, "_");
  let node;
  if (fd.t === "sel") {
    node = el("select");
    node.appendChild(el("option", null, ""));
    (Array.isArray(fd.e) ? fd.e : E[fd.e]).forEach(o => { const op = el("option", null, o); op.value = o; node.appendChild(op); });
    node.value = v(fd.p);
  } else if (fd.t === "bool") {
    const lab = el("label", "chk"); node = document.createElement("input");
    node.type = "checkbox"; node.checked = v(fd.p) === "true";
    lab.appendChild(node); lab.appendChild(el("span", null, v(fd.p) === "true" ? "Yes" : "No"));
    node.addEventListener("change", () => { setVal(fd.p, node.checked ? "true" : "false"); });
    node.id = id; wrap.appendChild(lab);
    if (fd.hint) wrap.appendChild(el("div", "hint", fd.hint));
    return wrap;
  } else if (fd.t === "ta") {
    node = el("textarea"); node.value = v(fd.p);
  } else {
    node = document.createElement("input");
    node.type = fd.t === "date" ? "date" : (fd.t === "num" ? "number" : "text");
    if (fd.step) node.step = fd.step;
    if (fd.plain) node.className = "plain";
    if (fd.ph) node.placeholder = fd.ph;
    node.value = v(fd.p);
  }
  node.id = id;
  if (fd.fixed || fd.auto) { node.readOnly = true; node.disabled = fd.t === "sel" && fd.fixed; }
  node.addEventListener("change", () => setVal(fd.p, node.value));
  node.addEventListener("input", () => { state.f[fd.p] = node.value; });
  wrap.appendChild(node);
  if (fd.hint) wrap.appendChild(el("div", "hint", fd.hint));
  const err = fieldError(fd);
  if (err) { wrap.classList.add("bad"); wrap.appendChild(el("div", "fielderr", err)); }
  return wrap;
}

function validLEI(s) {

}

/* ---------- text extraction per file type ---------- */
async function textFrom(file) {
  const name = file.name.toLowerCase();
  if (/\.(txt|md|csv|json|xml)$/.test(name)) return await file.text();
  if (/\.pdf$/.test(name)) {
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    const lib = window.pdfjsLib;
    lib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const buf = await file.arrayBuffer();
    const pdf = await lib.getDocument({ data: buf, isEvalSupported: false }).promise;
    let out = "";
    const pages = Math.min(pdf.numPages, 25);
    for (let i = 1; i <= pages; i++) {
      const pg = await pdf.getPage(i);
      const tc = await pg.getTextContent();
      out += tc.items.map(x => x.str).join(" ") + "\n";
    }
    return out;
  }
  if (/\.docx$/.test(name)) {
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
    const zip = await window.JSZip.loadAsync(await file.arrayBuffer());
    const f = zip.file("word/document.xml");
    if (!f) return "";
    const xml = await f.async("string");
    return xml.replace(/<\/w:p>/g, "\n").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ");
  }
  return "";
}

/* ---------- BDT XML import: exact, path for path ---------- */

  if (!root || root.localName !== "ICMABondDataTaxonomy") return 0;
  const byPath = {};
  (function walk(nd, path) {
    const kids = [...nd.children];
    if (!kids.length) { if (nd.textContent.trim()) byPath[path] = nd.textContent.trim(); return; }
    kids.forEach(k => walk(k, path ? path + "/" + k.localName : k.localName));
  })(root, "");
  let n = 0;
  FIELDS.forEach(fd => {
    if (fd.t === "group" || fd.ext) return;
    const val = byPath[fd.p];
    if (val === undefined || String(v(fd.p)) === String(val)) return;
    propose(fd.p, fd.l, val, src); n++;
  });
  const parties = [...root.getElementsByTagName("*")].filter(e => e.localName === "Party");
  if (parties.length) {
    const list = parties.map(p => ({
      PartyName: txt(p, "PartyName"), LEIIdentifier: txt(p, "LEIIdentifier"), BICIdentifier: txt(p, "BICIdentifier"),
      CountryOfIncorporation: txt(p, "CountryOfIncorporation"), PartyType: txt(p, "PartyType"),
      Roles: [...p.getElementsByTagName("*")].filter(e => e.localName === "PartyRoleType").map(e => e.textContent.trim()),
      Ratings: [...p.getElementsByTagName("*")].filter(e => e.localName === "Rating").map(r => ({ RatingAgency: txt(r, "RatingAgency"), RatingValue: txt(r, "RatingValue"), RatingOutlook: txt(r, "RatingOutlook") }))
    }));
    proposeGroup("parties", `${list.length} parties`, list, src); n++;
  }
  const ids = [...root.getElementsByTagName("*")].filter(e => e.localName === "SecurityIdentifier")
    .map(e => e.children[0]).filter(Boolean).map(c => ({ Type: c.localName, Value: c.textContent.trim() }));
  if (ids.length) { proposeGroup("ids", ids.map(i => i.Type + " " + i.Value).join(", "), ids, src); n++; }
  const dd = [...root.getElementsByTagName("*")].filter(e => e.localName === "DocumentDetail")
    .map(e => ({ DocumentName: txt(e, "DocumentName"), DocumentDate: txt(e, "DocumentDate"), DocumentLink: txt(e, "DocumentLink"), DocumentVersion: txt(e, "DocumentVersion") }));
  if (dd.length) { proposeGroup("docs", `${dd.length} documents`, dd, src); n++; }
  return n;
}

  { p: "IssuanceDataGroup/Issuance/SellingRestrictions/TEFRA/TefraCode", l: "TEFRA", fn: t => { const m = t.match(/TEFRA\s*([CD])\b/i); return m ? "TEFRA_" + m[1].toUpperCase() : ""; } },

];
const AGENCIES = [[/moody'?s/i, "MOODYS"], [/(?:standard\s*&\s*poor|s&p|sandp)/i, "SNPG"], [/fitch/i, "FITCH"], [/dbrs/i, "DBRS"], [/scope/i, "SCOPE"]];

function ingestText(text, src) {
  let n = 0;
  const t = text.replace(/\u00a0/g, " ");
  RULES.forEach(r => {
    let val = "";
    try { val = r.fn(t) || ""; } catch (e) { val = ""; }
    if (!val) return;
    if (String(v(r.p)).trim() === String(val).trim()) return;
    propose(r.p, r.l, String(val).trim(), src); n++;
  });
  const isin = (t.match(/\b([A-Z]{2}[A-Z0-9]{9}\d)\b/g) || []).find(validISIN);
  const cc = (t.match(/common code[:\s]{1,12}(\d{9})/i) || [])[1];
  if (isin || cc) {
    const list = [];
    if (isin) list.push({ Type: "ISIN", Value: isin });
    if (cc) list.push({ Type: "COMMON_CODE", Value: cc });
    if (JSON.stringify(list) !== JSON.stringify(state.ids)) { proposeGroup("ids", list.map(i => i.Type + " " + i.Value).join(", "), list, src); n++; }
  }
  const found = [];
  /* each agency is matched only against its own scale, so a Moody's rating nearby cannot be read as a Fitch one */
  const MOODYS = /\b(Aaa|Aa[123]|A[123]|Baa[123]|Ba[123]|B[123]|Caa[123])(?![A-Za-z0-9])/;
  const SP = /\b(AAA|AA[+-]?|A[+-]?|BBB[+-]?|BB[+-]?|B[+-]?|CCC[+-]?)(?![A-Za-z0-9])/;
  AGENCIES.forEach(([re, code]) => {
    const idx = t.search(re);
    if (idx < 0) return;
    const win = t.slice(idx, idx + 70);
    const m = win.match(code === "MOODYS" ? MOODYS : SP);
    if (m) found.push({ RatingAgency: code, RatingValue: m[1], RatingOutlook: "" });
  });
  if (found.length && JSON.stringify(found) !== JSON.stringify(state.ratings)) { proposeGroup("ratings", found.map(r => r.RatingAgency + " " + r.RatingValue).join(", "), found, src); n++; }
  const lei = (t.match(/\b([A-Z0-9]{20})\b/g) || []).find(validLEI);
  if (lei && state.parties[0] && !state.parties[0].LEIIdentifier) {
    const list = JSON.parse(JSON.stringify(state.parties)); list[0].LEIIdentifier = lei;
    proposeGroup("parties", "issuer LEI " + lei, list, src); n++;
  }
  return n;
}

/* ---------- suggestion store ---------- */
let sugSeq = 0;
function propose(p, l, val, src) {
  state.suggestions = state.suggestions.filter(s => !(s.kind === "field" && s.p === p));
  state.suggestions.push({ id: "s" + (++sugSeq), kind: "field", p: p, l: l, val: val, cur: String(v(p) || ""), src: src });
}
function proposeGroup(g, label, payload, src) {
  state.suggestions = state.suggestions.filter(s => !(s.kind === "group" && s.g === g));
  state.suggestions.push({ id: "s" + (++sugSeq), kind: "group", g: g, l: GROUPS[g].t + " list", val: label, cur: (state[g] || []).length + " entries", payload: payload, src: src });
}
function acceptSug(id) {
  const s = state.suggestions.find(x => x.id === id); if (!s) return;
  if (s.kind === "field") state.f[s.p] = s.val; else state[s.g] = s.payload;
  state.suggestions = state.suggestions.filter(x => x.id !== id);
  refreshAuto(); renderAll(); save();
}
function rejectSug(id) { state.suggestions = state.suggestions.filter(x => x.id !== id); renderForm(); save(); }

/* ---------- drop handling ---------- */
async function handleFiles(files) {
  let added = 0, sug = 0, notes = [];
  for (const file of files) {
    const nm = file.name;
    state.files.push({ name: nm, size: file.size, at: new Date().toISOString() });
    if (!state.docs.some(d => d.DocumentName === nm)) {
      state.docs = state.docs.filter(d => d.DocumentName || d.DocumentDate || d.DocumentLink);
      state.docs.push({ DocumentName: nm.replace(/\.[a-z0-9]+$/i, ""), DocumentDate: "", DocumentLink: nm, DocumentVersion: "" });
      added++;
    }
    let text = "";
    try { text = await textFrom(file); }
    catch (e) { notes.push(nm + ": could not be read in the browser, so it is attached only"); }
    if (!text) continue;
    if (/^\s*<\?xml|<Document/i.test(text)) {
      const n = ingestBDT(text, nm);
      if (n) { sug += n; continue; }
    }
    if (/^\s*\{/.test(text)) {
      try {
        const j = JSON.parse(text);
        if (j.vdrEnvelope && j.execution) { Object.entries(j.execution).forEach(([k, val]) => { const fd = FIELDS.find(x => x.p === "x:" + k); if (fd && String(v(fd.p)) !== String(val)) { propose(fd.p, fd.l, String(val), nm); sug++; } }); continue; }
      } catch (e) { /* fall through to text rules */ }
    }
    sug += ingestText(text, nm);
  }
  renderAll(); save();
  toast(`${files.length} file(s) attached. ${sug} suggested values for review.` + (notes.length ? " " + notes[0] : ""));
}

      const r = el("div", "sug");
      const c1 = el("div"); c1.appendChild(el("b", null, s.l)); c1.appendChild(el("span", "src", "from " + s.src));
      const c2 = el("div", "vals");
      if (s.cur) { c2.appendChild(el("s", null, s.cur)); c2.appendChild(el("span", null, " \u2192 ")); }
      c2.appendChild(el("b", null, s.val));
      const c3 = el("div", "inline");
      const ok = el("button", "mini primary", "Accept"); ok.onclick = () => acceptSug(s.id);

      c3.appendChild(ok); c3.appendChild(no);

    });
    wrap.appendChild(tbl);
    const bar = el("div", "inline"); bar.style.cssText = "max-width:360px;margin-top:10px";

/* ============================================================
   BDT 2.0 XML payload
   ============================================================ */
const MULTI = ["SellingRestrictions/CountryRestrictions", "BusinessDayCenter/CityCalendar"];
function node(name) { return { n: name, c: [], t: null }; }
function ensure(root, parts) {
  let cur = root;
  parts.forEach(p => {
    let k = cur.c.find(x => x.n === p);
    if (!k) { k = node(p); cur.c.push(k); }
    cur = k;
  });
  return cur;
}
function sortTree(nd) {
  const ord = ORDER[nd.n];
  if (ord) nd.c.sort((a, b) => {
    const ia = ord.indexOf(a.n), ib = ord.indexOf(b.n);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  nd.c.forEach(sortTree);
  return nd;
}
function ser(nd, d) {
  const pad = "  ".repeat(d);
  if (nd.t !== null && !nd.c.length) return `${pad}<${nd.n}>${esc(nd.t)}</${nd.n}>`;
  if (!nd.c.length) return `${pad}<${nd.n}/>`;
  return `${pad}<${nd.n}>\n` + nd.c.map(k => ser(k, d + 1)).join("\n") + `\n${pad}</${nd.n}>`;
}
function buildTree() {
  const root = node("ICMABondDataTaxonomy");
  FIELDS.forEach(fd => {
    if (fd.ext) return;
    if (fd.t === "group") return;
    if (!has(fd.p)) return;
    const parts = fd.p.split("/");
    if (MULTI.some(m => fd.p.endsWith(m))) {
      const parent = ensure(root, parts.slice(0, -1));
      String(v(fd.p)).split(",").map(s => s.trim()).filter(Boolean).forEach(val => {
        const k = node(parts[parts.length - 1]); k.t = val; parent.c.push(k);
      });
      return;
    }
    const leaf = ensure(root, parts); leaf.t = String(v(fd.p)).trim();
  });
  /* repeating groups */
  const di = ensure(root, ["DocumentInformation"]);
  di.c = di.c.filter(x => x.n !== "DocumentContacts");
  state.contacts.forEach(c => {
    const g = node("DocumentContacts");
    if (c.Name) { const k = node("Name"); k.t = c.Name; g.c.push(k); }
    if (c.Email) { const k = node("Email"); k.t = c.Email; g.c.push(k); }
    if (g.c.length) di.c.push(g);
  });
  if (state.parties.length) {
    const pg = ensure(root, ["IssuanceDataGroup", "PartyGroup"]);
    state.parties.forEach(p => {
      const pn = node("Party");
      const add = (n, val) => { if (val) { const k = node(n); k.t = val; pn.c.push(k); } };
      add("PartyName", p.PartyName); add("LEIIdentifier", p.LEIIdentifier); add("BICIdentifier", p.BICIdentifier);
      add("CountryOfIncorporation", p.CountryOfIncorporation);
      (p.Roles || []).forEach(r => { const pr = node("PartyRole"); const k = node("PartyRoleType"); k.t = r; pr.c.push(k); pn.c.push(pr); });
      add("PartyType", p.PartyType);
      if ((p.Ratings || []).some(r => r.RatingAgency || r.RatingValue)) {
        const rg = node("PartyRating");
        p.Ratings.forEach(r => {
          if (!(r.RatingAgency || r.RatingValue)) return;
          const rt = node("Rating");
          [["RatingAgency", r.RatingAgency], ["RatingValue", r.RatingValue], ["RatingOutlook", r.RatingOutlook]].forEach(([n, val]) => { if (val) { const k = node(n); k.t = val; rt.c.push(k); } });
          rg.c.push(rt);
        });

      pg.c.push(pn);
    });
  }
  if (state.docs.length) {
    const doc = ensure(root, ["IssuanceDataGroup", "Issuance", "IssuanceDocumentation"]);
    state.docs.forEach(d => {
      const dd = node("DocumentDetail");
      [["DocumentName", d.DocumentName], ["DocumentDate", d.DocumentDate], ["DocumentLink", d.DocumentLink], ["DocumentVersion", d.DocumentVersion]]
        .forEach(([n, val]) => { if (val) { const k = node(n); k.t = val; dd.c.push(k); } });
      if (dd.c.length) doc.c.push(dd);
    });
  }
  if (state.ids.length) {
    const sl = ensure(root, ["IssuanceDataGroup", "Product", "SecurityIdentifierList"]);
    state.ids.forEach(x => {
      if (!x.Value) return;
      const si = node("SecurityIdentifier"); const k = node(x.Type); k.t = x.Value; si.c.push(k); sl.c.push(si);
    });
  }
  if (state.ratings.length) {
    const rg = ensure(root, ["IssuanceDataGroup", "Product", "ExpectedProductRating"]);
    state.ratings.forEach(r => {
      if (!(r.RatingAgency || r.RatingValue)) return;
      const rt = node("Rating");
      [["RatingAgency", r.RatingAgency], ["RatingValue", r.RatingValue], ["RatingOutlook", r.RatingOutlook]].forEach(([n, val]) => { if (val) { const k = node(n); k.t = val; rt.c.push(k); } });
      rg.c.push(rt);
    });
  }
  return sortTree(root);
}
function buildXML() {
  const inner = ser(buildTree(), 1);

function legendBlocks() {
  const out = [];
  const tm = v("IssuanceDataGroup/Issuance/TargetMarket/ManufacturerTargetMarketType");
  const priips = v("IssuanceDataGroup/Issuance/SellingRestrictions/PRIIPsRestriction");
  const cci = v("IssuanceDataGroup/Issuance/SellingRestrictions/CCIRestriction");
  const regs = v("IssuanceDataGroup/Issuance/SellingRestrictions/REGS/RegSCode");
  const tefra = v("IssuanceDataGroup/Issuance/SellingRestrictions/TEFRA/TefraCode");
  const r144 = v("IssuanceDataGroup/Issuance/SellingRestrictions/RULE144A") === "true";
  const mgrs = state.parties.filter(p => (p.Roles || []).some(r => /MANAGER|BOOKRUNNER|COORDINATOR/.test(r))).map(p => p.PartyName);
  const stab = state.parties.filter(p => (p.Roles || []).includes("STABILISATION_MANAGER")).map(p => p.PartyName);
  const den = Number(v("IssuanceDataGroup/Issuance/SpecifiedDenomination/Value"));
  const cur = v("IssuanceDataGroup/Issuance/SpecifiedCurrency");
  const wholesale = tm && /PROF_AND_ECPS$/.test(tm);
  const agencies = [...new Set(state.ratings.filter(r => r.RatingAgency).map(r => r.RatingAgency))];

  if (tm) out.push(["Product governance target market",
    `Solely for the purposes of the manufacturer's product approval process, the target market assessment in respect of the notes has led to the conclusion that the target market is ${wholesale ? "eligible counterparties and professional clients only" : "retail clients, professional clients and eligible counterparties"}, each as defined in ${/^UK_/.test(tm) ? "the UK MiFIR regime as it forms part of UK domestic law" : "Directive 2014/65/EU (MiFID II)"}. All channels for distribution of the notes are appropriate. Any person subsequently offering, selling or recommending the notes is responsible for undertaking its own target market assessment and determining appropriate distribution channels. Recorded in the taxonomy as ${tm}.`]);

  if (priips && /^NO_EEA$/.test(priips)) out.push(["Prohibition of sales to EEA retail investors",
    "The notes are not intended to be offered, sold or otherwise made available to, and should not be offered, sold or otherwise made available to, any retail investor in the European Economic Area. No key information document required by Regulation (EU) No 1286/2014 has been prepared, and offering or selling the notes to any EEA retail investor may be unlawful."]);
  if (priips && /^NO_UK$/.test(priips)) out.push(["Prohibition of sales to UK retail investors",
    "The notes are not intended to be offered, sold or otherwise made available to, and should not be offered, sold or otherwise made available to, any retail investor in the United Kingdom."]);
  if (cci === "APPLICABLE") out.push(["United Kingdom consumer composite investments",
    "The UK Consumer Composite Investments regime replaced the UK PRIIPs Regulation on 6 April 2026. No product summary or other CCI disclosure has been prepared for the notes, and they are not intended for distribution to retail investors in the United Kingdom. Confirm the current wording with counsel, since transitional provisions continue to apply to legacy documentation."]);

  if (regs || tefra) out.push(["United States",
    `The notes have not been and will not be registered under the United States Securities Act of 1933. ${regs ? "They are offered outside the United States in reliance on Regulation S (" + regs.replace("REGS_", "") + ")" : "They are offered outside the United States"}${r144 ? " and within the United States to qualified institutional buyers in reliance on Rule 144A" : " and may not be offered or sold within the United States or to, or for the account or benefit of, US persons except pursuant to an exemption"}.${tefra && tefra.indexOf("TEFRA_") === 0 && tefra !== "TEFRA_NA" ? " " + tefra.replace("TEFRA_", "TEFRA ") + " rules apply." : ""}`]);

  if (v("x:stabilisation") === "APPLICABLE") out.push(["Stabilisation",
    `In connection with the issue of the notes, ${stab.length ? stab.join(", ") : "[stabilisation manager to be named]"} (or persons acting on its behalf) may over-allot the notes or effect transactions with a view to supporting the market price of the notes at a level higher than that which might otherwise prevail. There is no assurance that stabilisation will be undertaken. ${v("x:stabPeriod") ? "Stabilisation period: " + v("x:stabPeriod") + "." : ""} ${v("x:overAllot") ? "Over-allotment: " + v("x:overAllot") + "." : ""} Any stabilisation action must be conducted in accordance with all applicable laws and rules, and a pre-stabilisation notice must be published before stabilisation begins.`]);

  if (agencies.length) out.push(["Credit ratings",
    `The expected ratings above are assigned by ${agencies.join(", ")}. A credit rating is not a recommendation to buy, sell or hold securities and may be revised, suspended or withdrawn at any time. Confirm the registration status of each agency under the EU and UK CRA Regulations before the terms are circulated.${v("x:ratingsDisclaimer") ? " " + v("x:ratingsDisclaimer") : ""}`]);

  if (den && cur) out.push(["Denomination",
    `The notes are issued in denominations of ${cur} ${den.toLocaleString("en-GB")}${den >= 100000 && wholesale ? ", consistent with a wholesale offering" : ", which is a retail denomination and changes the disclosure position"}.`]);

  if (v("x:prospectusRegime")) out.push(["Offer documentation", v("x:prospectusRegime")]);
  if (v("x:costsCharges")) out.push(["Costs and charges", v("x:costsCharges")]);

  out.push(["Status of this record",
    `Indicative terms at the ${STAGES[state.stage - 1].t.toLowerCase()} stage, version ${state.ver}, released through the VDR by ${mgrs.length ? mgrs.join(", ") : "the bookrunners"}. Not an offer to sell or a solicitation of an offer to buy securities, and not for distribution where such distribution would be unlawful. The legal documentation prevails over this digital record.`]);
  return out;
}

/* ---- what changed since the last release ---- */
function snapshot() {
  return { f: Object.assign({}, state.f), parties: JSON.parse(JSON.stringify(state.parties)), ids: JSON.parse(JSON.stringify(state.ids)), docs: JSON.parse(JSON.stringify(state.docs)), ratings: JSON.parse(JSON.stringify(state.ratings)) };
}
function diffSince() {
  const last = state.releases[state.releases.length - 1];
  if (!last || !last.snap) return null;
  const rows = [];
  const skip = ["DocumentInformation/DocumentId", "DocumentInformation/DocumentVersion", "DocumentInformation/DocumentDescription", "IssuanceDataGroup/Issuance/AdditionalIssuanceInformation"];
  FIELDS.forEach(fd => {
    if (fd.t === "group" || skip.includes(fd.p)) return;
    const a = String(last.snap.f[fd.p] ?? ""), b = String(state.f[fd.p] ?? "");
    if (a !== b) rows.push([fd.l, a, b]);
  });
  ["parties", "ids", "docs", "ratings"].forEach(k => {
    const a = JSON.stringify(last.snap[k] || []), b = JSON.stringify(state[k] || []);
    if (a !== b) rows.push([GROUPS[k].t + " list", (last.snap[k] || []).length + " entries", (state[k] || []).length + " entries, amended"]);
  });
  return { since: last.version, stage: last.stage, rows: rows };
}

/* in-page prompt and confirm, since sandboxed frames may block the native ones */
function overlay(msg, mode) {
  return new Promise(res => {
    const bg = el("div"); bg.style.cssText = "position:fixed;inset:0;background:rgba(10,16,22,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px";
    const box = el("div"); box.style.cssText = "background:var(--surface);border:1px solid var(--rule-strong);padding:18px;max-width:420px;width:100%";
    const m = el("div", null, msg); m.style.cssText = "font-size:14px;margin-bottom:12px"; box.appendChild(m);
    let inp;
    if (mode === "text") {
      inp = document.createElement("input"); inp.type = "text"; inp.style.width = "100%";
      inp.placeholder = "Name and desk"; box.appendChild(inp);
    }
    const bar = el("div"); bar.style.cssText = "display:flex;gap:8px;justify-content:flex-end;margin-top:14px";
    const no = el("button", "ghost", "Cancel"); const yes = el("button", "primary", mode === "text" ? "Authorise" : "Continue");
    bar.appendChild(no); bar.appendChild(yes); box.appendChild(bar); bg.appendChild(box); document.body.appendChild(bg);
    if (inp) inp.focus(); else yes.focus();
    const done = r => { bg.remove(); res(r); };
    no.onclick = () => done(null);
    yes.onclick = () => done(mode === "text" ? (inp.value.trim() || null) : true);
    bg.addEventListener("keydown", e => { if (e.key === "Escape") done(null); if (e.key === "Enter" && mode === "text") yes.click(); });
  });
}

async function release() {
  const t = tally();
  if (t.fail) { toast("Blocking checks must be cleared first"); return; }
  const by = await overlay("Name of the bookrunner authorising release of version " + state.ver + " at stage " + STAGES[state.stage - 1].t + ".", "text");
  if (!by) return;
  state.seq += 1; refreshAuto();
  const parts = state.ver.split("."); state.ver = `${parts[0]}.${Number(parts[1] || 0) + 1}`;
  refreshAuto();
  state.releases.push({ at: new Date().toISOString(), version: state.ver, stage: STAGES[state.stage - 1].t, documentId: v("DocumentInformation/DocumentId"), by: by, checks: t, snap: snapshot() });
  tab = "dist"; renderAll(); save();
  toast(`Version ${state.ver} released. Distribute through the channels below.`);
}
