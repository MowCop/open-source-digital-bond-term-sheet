name: Term sheet core verification

on:
  push:
    paths:
      - "src/lib/termsheet/**"
      - "src/lib/bdt-bridge.ts"
      - "schema/**"
      - "verify.mjs"
      - "github/workflows/termsheet-verify.yml"
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install libxml2-utils (xmllint)
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify term sheet core reproduces the reference output
        run: node verify.mjs

      - name: Validate generated XML against the ICMA BDT 2.0 schema
        run: xmllint --noout --schema schema/icma-bond-data-taxonomy.xsd module-output.xml
